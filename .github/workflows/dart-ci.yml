name: Dart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: python3 tool/static_audit.py
      - run: python3 tool/companion_audit.py
      - run: python3 tool/visual_noise_audit.py
      - run: node --check web/app.js
      - run: node --check web/player.js
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib test bin tool benchmark
      - run: dart analyze
      - run: dart test
      - run: dart run tool/variation_audit.dart --samples 50
